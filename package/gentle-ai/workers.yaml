# Gentle AI — SDD Worker Bridge
# Portable across Windows/Linux. No machine-absolute skill paths.
# Location: ~/.config/gentle-ai/workers.yaml
# Optional project override: <repo>/.atl/sdd-workers.yaml (deep-merge over this file)
#
# v1.2 notes (structured output):
# - output_format: json | stream-json  (CLI --output-format overrides)
# - json_schema: default | none | <path>  (CLI --json-schema / --no-json-schema)
# - Runner strips conflicting --output-format/--json-schema from extra_args, then appends.
# - Default schema: ~/.config/gentle-ai/schemas/sdd-phase-result.schema.json
#
# v1.1 notes (agy model/effort):
# - Gemini ids ending in -low|-medium|-high bake effort into the name.
#   The runner aligns --effort to that suffix (never medium + *-high).
# - Claude / gpt-oss reject --effort; runner omits the flag automatically.
# - default_effort is only used when the model has NO effort suffix AND supports effort.
#
# v1.3 note (2026-07-31): ALL SDD phases are agy-eligible (simple route). Apply may
# edit source files; commits/PR and review lifecycle remain orchestrator-only.
# The RFC design (docs/rfc-apply-hybrid-slices.md: --role apply-batch, HITL prompt,
# allowlist scope, apply-batch-result schema) is deferred.
#
# v1.5 note (2026-07-31): live stderr progress on stream-json.
# - output_format default switched to stream-json (step_update/result NDJSON).
# - stream_progress: true (default) prints [agy] lifecycle, step ticks and
#   heartbeat to stderr; --no-stream-progress on the runner disables ticks.
# - Stdout envelope contract unchanged: final JSON is parsed from the result event.
#
# v1.6 note (2026-08-07): stream_progress_detail levels.
# - summary (default): friendly label only.
# - tools: + tool name and key parameters (run_command -> CommandLine, etc.).
# - full: tools + live model text_delta streaming + duration/tokens on step close.
# - CLI --stream-progress-detail overrides. Envelope meta includes the level.
#
# v1.4 note (2026-07-31): native /sdd-<phase> skill expansion in print mode.
# - slash_command_skills: auto|on|off (CLI --slash-command-skills overrides)
# - auto: enabled when agy >= 1.1.9; off: literal prompts (+ --disable-slash-commands on >= 1.1.9)
# - Runner drops the main SKILL.md from the read block when the skill is mirrored
#   to an agy-scanned root (~/.gemini/antigravity-cli/skills or ~/.gemini/antigravity/skills).

version: 1

workers:
  agy:
    enabled: true
    # Must be on PATH on every workstation
    command: agy
    # Defaults for runner when CLI flags omitted (simple scalars — custom YAML parser)
    output_format: stream-json
    json_schema: default
    # stderr progress ticks + heartbeat (runner --no-stream-progress to disable)
    stream_progress: true
    # Verbosity of stderr progress: summary | tools | full
    # summary: friendly label only | tools: + tool name/params | full: + live text_delta + tokens
    # (CLI --stream-progress-detail overrides)
    stream_progress_detail: full
    # auto|on|off — native /sdd-<phase> skill expansion in print mode.
    # auto: enabled when agy >= 1.1.9; off: literal prompts (+ --disable-slash-commands).
    slash_command_skills: auto
    # v2.0 (2026-08-15): herdr is the ONLY transport. The legacy `direct`
    # transport was removed from run-agy-phase.mjs — without herdr there is no
    # way to watch what agy is doing. --transport / this key are ignored.
    transport: herdr
    herdr:
      tab_label: "sdd-{phase}-{change}"
      stalled_gate:
        tier1_startup_ms: 10000
        tier2_rolling_ms: 120000
        poll_interval_ms: 10000
      blocked_policy: notify
      blocked_timeout_ms: 300000
      allowlist:
        - "Proceed?"
    extra_args:
      # Runner merges --output-format / --json-schema; keep permissions here
      - "--dangerously-skip-permissions"
    default_timeout: 10m
    plan_mode_explore: false
    default_model: null
    # Prefer null so Gemini suffix models are not forced to a mismatched effort.
    # Runner still derives effort from -low|-medium|-high suffixes.
    default_effort: null
    model_by_phase:
      explore: gemini-3.7-flash-medium
      propose: gemini-3.7-flash-high
      spec: gemini-3.7-flash-high
      # Claude is fine: runner strips --effort
      design: claude-sonnet-4-6
      tasks: gemini-3.7-flash-high
      verify: claude-sonnet-4-6
      apply: gemini-3.7-flash-high
      archive: gemini-3.7-flash-medium
      init: gemini-3.7-flash-medium
      onboard: claude-sonnet-4-6
    # Optional per-phase effort overrides (only applied when model supports effort
    # and has no -low|-medium|-high suffix). Prefer leaving unset.
    effort_by_phase: {}
    # Walked in order on quota_exceeded — every model tried before switching worker (v2)
    model_fallback:
      - gemini-3.6-flash-high
      - claude-sonnet-4-6
      - gemini-3.1-pro-high
      - gemini-3.6-flash-medium
    profiles:
      fast:
        label: Fast
        model: gemini-3.7-flash-medium
        # effort ignored/aligned by runner from model suffix
        effort: medium
      balanced:
        label: Balanced
        model: gemini-3.7-flash-high
        effort: high
      strong:
        label: Strong
        model: claude-sonnet-4-6
        effort: null
    # v2: orchestrator model+effort recommendation per task kind (universal selector)
    recommend_by_task:
      read:     { model: gemini-3.7-flash-medium, effort: medium }
      write:    { model: gemini-3.7-flash-high,   effort: high }
      design:   { model: claude-sonnet-4-6,      effort: null }
      heavy:    { model: claude-opus-4-6-thinking, effort: null }

  opencode:
    enabled: true
    # Native task subagents: sdd-<phase>
    # Model comes from opencode.json agent.sdd-<phase>.model when set

policy:
  # ask-each-phase | prefer-agy | prefer-opencode | opencode-only | agy-only
  default: ask-each-phase
  eligible:
    - explore
    - propose
    - spec
    - design
    - tasks
    - apply
    - verify
    - archive
    - init
    - onboard
  # Reserved — no SDD phase is ineligible by default (all phases are agy-eligible).
  # Review lifecycle gates and commit/PR are orchestrator-only by design, not via this list.
  ineligible: []
  # never | on-agy-ask | always-profiles
  model_picker: on-agy-ask
  phase_overrides: {}

failover:
  on:
    - quota_exceeded
    - timeout
    - unavailable
    - invalid_result_contract
    - invalid_model_selection
  # v2: walk the ENTIRE model_fallback chain in order before switching worker
  walk_model_fallback_chain: true
  to_other_worker: true
  max_attempts_per_phase: 2

timeouts:
  explore: 10m
  propose: 12m
  spec: 12m
  design: 15m
  tasks: 10m
  verify: 15m
  apply: 20m
  archive: 10m
  init: 10m
  onboard: 15m

skill_discovery:
  - "{config}/opencode/skills"
  - "{home}/.gemini/antigravity-cli/skills"
  - "{home}/.config/opencode/skills"
  - "{repo}/.agents/skills"
  - "{repo}/.agent/skills"
