# Gentle AI — SDD Worker Bridge
# Portable across Windows/Linux. No machine-absolute skill paths.
# Location: ~/.config/gentle-ai/workers.yaml
# Optional project override: <repo>/.atl/sdd-workers.yaml (deep-merge over this file)
#
# v1.1 notes (agy model/effort):
# - Gemini ids ending in -low|-medium|-high bake effort into the name.
#   The runner aligns --effort to that suffix (never medium + *-high).
# - Claude / gpt-oss reject --effort; runner omits the flag automatically.
# - default_effort is only used when the model has NO effort suffix AND supports effort.

version: 1

workers:
  agy:
    enabled: true
    # Must be on PATH on every workstation
    command: agy
    extra_args:
      - "--output-format"
      - "json"
      - "--dangerously-skip-permissions"
    default_timeout: 10m
    plan_mode_explore: false
    default_model: null
    # Prefer null so Gemini suffix models are not forced to a mismatched effort.
    # Runner still derives effort from -low|-medium|-high suffixes.
    default_effort: null
    model_by_phase:
      explore: gemini-3.6-flash-medium
      propose: gemini-3.1-pro-high
      spec: gemini-3.1-pro-high
      # Claude is fine: runner strips --effort
      design: claude-sonnet-4-6
      tasks: gemini-3.6-flash-high
      verify: claude-sonnet-4-6
    # Optional per-phase effort overrides (only applied when model supports effort
    # and has no -low|-medium|-high suffix). Prefer leaving unset.
    effort_by_phase: {}
    # Tried once on quota/unavailable before switching worker
    model_fallback:
      - gemini-3.6-flash-high
      - gemini-3.6-flash-medium
    profiles:
      fast:
        label: Fast
        model: gemini-3.6-flash-medium
        # effort ignored/aligned by runner from model suffix
        effort: medium
      balanced:
        label: Balanced
        model: gemini-3.6-flash-high
        effort: high
      strong:
        label: Strong
        model: gemini-3.1-pro-high
        effort: high

  opencode:
    enabled: true
    # Native task subagents: sdd-<phase>
    # Model comes from opencode.json agent.sdd-<phase>.model when set

policy:
  # ask-each-phase | prefer-agy | prefer-opencode | opencode-only | agy-only
  default: ask-each-phase
  eligible:
    - explore
    - propose
    - spec
    - design
    - tasks
    - verify
  ineligible:
    - apply
    - archive
    - init
    - onboard
  # never | on-agy-ask | always-profiles
  model_picker: on-agy-ask
  phase_overrides: {}

failover:
  on:
    - quota_exceeded
    - timeout
    - unavailable
    - invalid_result_contract
    - invalid_model_selection
  try_model_fallback_once: true
  to_other_worker: true
  max_attempts_per_phase: 2

timeouts:
  explore: 10m
  propose: 12m
  spec: 12m
  design: 15m
  tasks: 10m
  verify: 15m

skill_discovery:
  - "{config}/opencode/skills"
  - "{home}/.gemini/antigravity-cli/skills"
  - "{home}/.config/opencode/skills"
  - "{repo}/.agents/skills"
  - "{repo}/.agent/skills"
